<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 3200" fill="none" class="bg-organic-curves-svg">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#E5C384" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#C5A059" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- Curve Path 1: Top Hero to Brand -->
  <path id="curve-path-1" class="parallax-path" d="M -100 200 C 300 50, 700 450, 1100 200 C 1350 50, 1500 350, 1400 650 C 1300 950, 800 700, 400 900 C 100 1050, 50 1300, 350 1450 C 650 1600, 1200 1350, 1350 1700" stroke="url(#goldGradient)" stroke-width="1.8" stroke-dasharray="8 4" />

  <!-- Curve Path 2: Middle Pinned Texture & Products -->
  <path id="curve-path-2" class="parallax-path" d="M 1500 1800 C 1100 2000, 600 1850, 200 2100 C -100 2300, 150 2600, 600 2500 C 1050 2400, 1450 2700, 1200 2950 C 950 3200, 400 3050, -50 3250" stroke="url(#goldGradient)" stroke-width="1.5" />

  <!-- Decorative Floating Ellipses & Loops (matching reference video) -->
  <ellipse cx="1200" cy="400" rx="180" ry="120" stroke="url(#goldGradient)" stroke-width="1.2" transform="rotate(-15 1200 400)" />
  <ellipse cx="200" cy="1150" rx="220" ry="140" stroke="url(#goldGradient)" stroke-width="1.2" transform="rotate(25 200 1150)" />
  <ellipse cx="1300" cy="2250" rx="160" ry="190" stroke="url(#goldGradient)" stroke-width="1.2" transform="rotate(-30 1300 2250)" />
</svg>
